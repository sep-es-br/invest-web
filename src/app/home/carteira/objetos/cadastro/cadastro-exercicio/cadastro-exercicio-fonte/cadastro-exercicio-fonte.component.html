<form>
        
        <div>
                <fa-icon *ngIf="lastElem && !(cadastrado && !emPeriodoRevisao)" [icon]="addIcon" class="add" (click)="onAdd.emit()"></fa-icon>
        </div>
        <div>
                <fa-icon *ngIf="!(cadastrado && !emPeriodoRevisao)" [icon]="removerIcon" class="remover" (click)="onRemover.emit(fonteValores)"></fa-icon>
        </div>
        <ng-select [(ngModel)]="fonteValores.fonteOrcamentaria"
                [ngModelOptions]="{standalone: true}"
                [items]="optionsFontes"
                placeholder="Selecionar a fonte orçamentária"
                bindValue="value"
                [compareWith]="selecionarFonte"
                [searchFn]="filtrar"  [disabled]="cadastrado && !emPeriodoRevisao"
                [ngClass]="(checado && !valido) ? 'invalido' : ''"
                ></ng-select>  


        <input type="text" [(ngModel)]="fonteValores.planejado" [ngModelOptions]="{standalone: true}"
                 placeholder="R$ " currencyMask  [disabled]="cadastrado && !emPeriodoRevisao"/>
        <fa-icon *ngIf="!(cadastrado && !emPeriodoRevisao)" [icon]="limparIcon" class="apagar" (click)="fonteValores.planejado = null"></fa-icon>

        <input type="text" [(ngModel)]="fonteValores.contratado" [ngModelOptions]="{standalone: true}"
                placeholder="R$ " [disabled]="!contratadoEditavel" currencyMask/>
        <fa-icon [icon]="limparIcon" class="apagar" (click)="fonteValores.contratado = null"></fa-icon>


</form>
