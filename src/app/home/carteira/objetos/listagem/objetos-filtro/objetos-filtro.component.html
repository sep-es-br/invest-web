<p-checkBox [(ngModel)]="filtro.audiencia"
            [ngModelOptions]="{standalone: true}" 
            [binary]="true" 
            (ngModelChange)="update()"
            inputId="audiencia" />
<label for="audiencia">Audiência Pública</label>

<ng-select [items]="unidades"
            [multiple]="true"
            placeholder="Unidade Orçamentária"
            [(ngModel)]="filtro.unidades"
            [ngModelOptions]="{standalone: true}"
            [disabled]="unidades?.length <= 0"
            [searchFn]="searchUnidade"
            [clearable]="true"
            (ngModelChange)="update(); updatePOs()"
        >
    <ng-template ng-label-tmp let-item="item" let-index="index">
        {{item.codigo}}
        <button (click)="filtro.unidades = removerSelecao(filtro.unidades, item); this.update(); updatePOs()">
            <fa-icon class="removerItem" [icon]="removerIcon" [attr.aria-label]="'remover unidade ' + item.codigo"></fa-icon>
        </button>
    </ng-template>
    <ng-template ng-option-tmp let-item="item">
        {{item.codigo}} - {{item.sigla}}
    </ng-template>
</ng-select>

<ng-select [items]="planos"
            [multiple]="true"
            placeholder="Plano Orçamentário"
            [(ngModel)]="filtro.planos"
            [ngModelOptions]="{standalone: true}"
            [searchFn]="searchPlano"
            [clearable]="true"
            (ngModelChange)="update()"
        >
    <ng-template ng-label-tmp let-item="item" let-index="index">
        {{item.codigo}}
        <button (click)="filtro.planos = removerSelecao(filtro.planos, item); this.update()">
            <fa-icon class="removerItem" [icon]="removerIcon" [attr.aria-label]="'remover plano ' + item.codigo"></fa-icon>
        </button>
    </ng-template>
    <ng-template ng-option-tmp let-item="item">
        {{item.codigo}} - {{item.nome}}
    </ng-template>
</ng-select>

<ng-select [items]="gndOpcoes"
            placeholder="GND"
            [(ngModel)]="filtro.gnd"
            [ngModelOptions]="{standalone: true}"
            [clearable]="true"
            (ngModelChange)="update()"
            bindValue="value"
        >
</ng-select>

<ng-select class="menor"
            [items]="status"
            placeholder="Status"
            [(ngModel)]="filtro.status"
            [ngModelOptions]="{standalone: true}"
            [searchFn]="filtrarSimples"
            [clearable]="true"
            (ngModelChange)="update()"
        >
    <ng-template ng-label-tmp let-item="item" let-index="index">
        {{item.nome}}
    </ng-template>
    <ng-template ng-option-tmp let-item="item">
        {{item.nome}}
    </ng-template>
</ng-select>

<ng-select class="menor"
            [items]="anos"
            [(ngModel)]="filtro.exercicio"
            [ngModelOptions]="{standalone: true}"
            [clearable]="false"
            (ngModelChange)="update()"
        >
</ng-select>
