<spo-progress-modal [visivel]="carregando"></spo-progress-modal>
<div class="filtro">
    <ng-select [items]="areasTematicas"
            placeholder="Área Temática"
            [(ngModel)]="filtro.areaTematica"
            [ngModelOptions]="{standalone: true}"
            [searchFn]="searchArea"
            bindLabel="nome"
            [clearable]="true"
            (ngModelChange)="update(paginaAtual)"
        >
    </ng-select>
    <ng-select [items]="unidades"
            [multiple]="true"
            placeholder="Unidade Orçamentária"
            [(ngModel)]="filtro.unidades"
            [ngModelOptions]="{standalone: true}"
            [disabled]="unidades?.length <= 0"
            [searchFn]="searchUnidade"
            [clearable]="true"
            (ngModelChange)="update(paginaAtual)"
        >
        <ng-template ng-label-tmp let-item="item" let-index="index">
            {{item.codigo}}
            <fa-icon role="button" class="removerItem" [icon]="removerIcon" [attr.aria-label]="'remover unidade ' + item.codigo"
                    (click)="filtro.unidades = removerSelecao(filtro.unidades, item); this.update(paginaAtual)"></fa-icon>
        </ng-template>
        <ng-template ng-option-tmp let-item="item">
            {{item.codigo}} - {{item.sigla}}
        </ng-template>
    </ng-select>
</div>
<header>
    <h3>Propostas ({{qtPropostas}})</h3>
    <spo-campo-pesquisa
        [(ngModel)]="filtro.filtroTexto"
        (ngModelChange)="update(paginaAtual, $event)"
        [ngModelOptions]="{standalone: true}"></spo-campo-pesquisa>
        
</header>
<div class="lista">
    <spo-tira-lista [lista]="propostaLista"></spo-tira-lista>
    <spo-barra-paginacao [larguraPaginacao]="7" [quantidade]="qtPropostas" (onPageChange)="update($event)"></spo-barra-paginacao>
</div>
