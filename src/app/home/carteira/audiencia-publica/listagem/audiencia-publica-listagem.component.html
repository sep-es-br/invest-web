<spo-progress-modal [visivel]="carregando"></spo-progress-modal>
<div class="filtro">
    <ng-select [items]="areasTematicas"
            placeholder="Área Temática"
            [(ngModel)]="filtro.areaTematica"
            [ngModelOptions]="{standalone: true}"
            [searchFn]="searchArea"
            bindLabel="nome"
            [clearable]="true"
            (ngModelChange)="update()"
        >
    </ng-select>
    <ng-select [items]="unidades"
            [multiple]="true"
            placeholder="Unidade Orçamentária"
            [(ngModel)]="filtro.unidades"
            [ngModelOptions]="{standalone: true}"
            [disabled]="unidades?.length <= 0"
            [searchFn]="searchUnidade"
            [clearable]="true"
            (ngModelChange)="update()"
        >
        <ng-template ng-label-tmp let-item="item" let-index="index">
            {{item.codigo}}
            <fa-icon role="button" class="removerItem" [icon]="removerIcon" [attr.aria-label]="'remover unidade ' + item.codigo"
                    (click)="filtro.unidades = removerSelecao(filtro.unidades, item); this.update()"></fa-icon>
        </ng-template>
        <ng-template ng-option-tmp let-item="item">
            {{item.codigo}} - {{item.sigla}}
        </ng-template>
    </ng-select>
</div>
<header>
    <h3>Propostas ({{qtPropostas}})</h3>
    <spo-campo-pesquisa
        [(ngModel)]="filtro.filtroTexto"
        (ngModelChange)="update($event)"
        [ngModelOptions]="{standalone: true}"></spo-campo-pesquisa>
        
</header>
<div class="lista">
    <table>
        <tr *ngFor="let proposta of listaPropostas">
            <td>
                <h4>Proposta</h4>
                <p class="overflow-2" title="{{proposta.proposalText}}">{{proposta.proposalText}}</p>
            </td>
            <td>
                <h4>Área Temática</h4>
                <p>{{proposta.areaName}}</p>
            </td>
            <td>
                <h4>Unidade Orçamentária</h4>
                <p class="overflow-1">({{proposta.budgetUnitId}}) {{proposta.budgetUnitName}}</p>
            </td>
            <td>
                <h4>Microrregião</h4>
                <p>{{proposta.microrregion}}</p>
            </td>
            <td><fa-icon 
                class="criarIcon" [icon]="criarIcon" aria-label="Criar Objeto"
                (click)="criarObjeto(proposta)"></fa-icon></td>
        </tr>
    </table>
</div>
