<div class="content" #principal>
    <header>
        <p>Adicionar Grupo</p>
        <div class="botaoAcao" (click)="fechar()">
            <fa-icon [icon]="iconFechar"></fa-icon>
        </div>
    </header>
    <main>
        <form>
            <label for="inIcone">Ícone:</label>
            <spo-seletor-icone id="inIcone" [(ngModel)]="grupo.icone" [ngModelOptions]="standaloneModelOpt" />
            <label for="inNome">Nome:</label>
            <input type="text" id="inNome" [(ngModel)]="grupo.nome" [ngModelOptions]="standaloneModelOpt" (blur)="gerarSigla($event, siglaModel)"/>
            <label for="inSigla">Sigla:</label>
            <input type="text" id="inSigla" #siglaModel="ngModel"
                [(ngModel)]="grupo.sigla" [ngModelOptions]="standaloneModelOpt" />
            <label for="inDescricao">Descrição:</label>
            <textarea rows="5" id="inDescricao" [(ngModel)]="grupo.descricao"></textarea>
        </form>
    </main>
    <footer>
        <button id="btnSalvar" (click)="salvar()">
            <fa-icon [icon]="iconSalvar"></fa-icon>Salvar
        </button>
    </footer>
</div>
