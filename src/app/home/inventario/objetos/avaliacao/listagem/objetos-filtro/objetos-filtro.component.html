<form class="d-flex justify-content-center justify-content-lg-between row">
  <div class="col-6 col-lg-3">
    <ng-select
      class="menor"
      placeholder="Unidade Orçamentária"
      [items]="unidades"
      [multiple]="true"
      [searchFn]="searchUnidade"
      [clearable]="true"
      [ngModelOptions]="{standalone: true}"
      [(ngModel)]="filtro.unidade"
      (ngModelChange)="atualizar()"
    >
      <ng-template ng-label-tmp let-item="item" let-index="index">
        {{item.codigo}}
        <button (click)="filtro.unidade = removerSelecao(filtro.unidade, item); this.atualizar()">
          <fa-icon class="removerItem" [icon]="removerIcon" [attr.aria-label]="'remover unidade ' + item.codigo"></fa-icon>
        </button>
      </ng-template>
      <ng-template ng-option-tmp let-item="item">
        {{item.codigo}} - {{item.sigla}}
      </ng-template>
    </ng-select>
  </div>

  <div class="col-6 col-lg-3">
    <ng-select
      class="menor"
      placeholder="Etapa"
      [items]="etapas" class="menor"
      [clearable]="true"
      [searchFn]="filtrarSimples"
      [(ngModel)]="filtro.etapa"
      [ngModelOptions]="{standalone: true}"
      (ngModelChange)="atualizar()"
    >
      <ng-template ng-label-tmp let-item="item" let-index="index">
        {{item.nome}}
      </ng-template>
      <ng-template ng-option-tmp let-item="item">
        {{item.nome}}
      </ng-template>
    </ng-select>
  </div>

  <div class="col-6 col-lg-3">
    <ng-select
      class="menor"
      placeholder="Status"
      [items]="status" class="menor"
      [clearable]="true"
      [searchFn]="filtrarSimples"
      [ngModelOptions]="{standalone: true}"
      [(ngModel)]="filtro.status"
      (ngModelChange)="atualizar()"
    >
      <ng-template ng-label-tmp let-item="item" let-index="index">
        {{item.nome}}
      </ng-template>
      <ng-template ng-option-tmp let-item="item">
        {{item.nome}}
      </ng-template>
    </ng-select>
  </div>

  <div class="col-6 col-lg-3">
    <ng-select
      class="menor"
      [items]="anos"
      [clearable]="false"
      [ngModelOptions]="{standalone: true}"
      [(ngModel)]="filtro.ano"
      (ngModelChange)="atualizar()"
    >
    </ng-select>
  </div>
</form>
