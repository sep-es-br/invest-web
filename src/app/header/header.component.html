<div id="content">
    
    @if (isMobile) {
        <button class="btn neutro menuBtn" (click)="onMenuClick.emit($event)"><fa-icon [icon]="menuIcon"></fa-icon></button>
    }    
    <div id="titleMain">
        <p id="title">{{title}}</p>
        <p id="breadcrumb"><spo-breadcrumb></spo-breadcrumb></p>
    </div>
    <div id="acoes">
        <button id="objetos" class="botaoAcao" title="Listagem de Avaliação" (click)="redirectTo('home/inventario/objetos/avaliacao')"> 
            <img src="assets/img/hammer.svg" width="20px">
            <div *ngIf="qtObjetos > 0">{{qtObjetos}}</div>
        </button>
    </div>
    <button id="userInfo" (click)="showMenuUser = !showMenuUser">
        <div #userImg id="userImg">
            <img [src]="userImage" *ngIf="userImage; else iniciaisElem" />
            <ng-template #iniciaisElem>{{iniciais}}</ng-template> 
        </div>
        <div id="userData">
            <p>{{userSignal()?.name}}</p>
        </div>
        <div #menuUser class="menuUser" *ngIf="showMenuUser" @openClose>
            <button (click)="redirectTo('home/meuperfil')">Meu Perfil</button>
            <button *ngIf="permissaoAdm" (click)="redirectTo('home/administracao')">Administração</button>
            <button (click)="logout()">Sair</button>
        </div>
    </button>
    
</div>
